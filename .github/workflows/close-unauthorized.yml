name: Close Unauthorized PRs and Issues

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  close-unauthorized:
    runs-on: ubuntu-latest
    steps:
      - name: Check if contributor is authorized
        if: github.actor != 'Nickog47' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v6
        with:
          script: |
            const actor = context.actor;
            const isPR = context.eventName === 'pull_request_target';
            const number = isPR ? context.payload.pull_request.number : context.payload.issue.number;

            const message = `Thank you for your interest, but this is a private repository. Pull requests and issues from unauthorized contributors are not accepted.\n\nOnly the repository owner is authorized to make changes.\n\nThis ${isPR ? 'pull request' : 'issue'} will be closed automatically.`;

            // Add comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: message
            });

            // Close the PR or issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              state: 'closed'
            });

            // Lock the conversation to prevent further spam
            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              lock_reason: 'spam'
            });
